<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template preview</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-bg: #0b0f14;
        --color-edge: #243040;
        --color-mut: #8b98a5;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      html, body { height: 100%; }
      body { @apply bg-bg font-sans flex flex-col; }
    </style>
  </head>
  <body>
    <div id="bar" class="flex items-center gap-4 px-4 py-2 bg-bg border-b border-edge text-xs text-slate-300">
      <a href="index.html" class="text-sky-300 hover:underline no-underline">&larr; demos</a>
      <span id="file" class="flex-1 min-w-0 truncate font-mono text-[11px] text-mut"></span>
      <a id="raw" href="#" target="_blank" rel="noopener" class="text-sky-300 hover:underline no-underline">open raw &nearr;</a>
    </div>
    <div id="err" class="hidden p-8 text-red-300 text-sm"></div>
    <iframe id="frame" title="Template preview" class="flex-1 w-full border-0 bg-white"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const embed = params.get("embed") === "1";
      if (embed) document.getElementById("bar").style.display = "none";
      const f = params.get("f") || "";
      const err = (msg) => { const e = document.getElementById("err"); e.classList.remove("hidden"); e.textContent = msg; };
      if (!/^templates\/[\w.\/-]+\.html$/.test(f) || f.includes("..")) {
        err("Missing or invalid ?f= parameter (expected templates/<demo>/<page>.html).");
      } else {
        const dir = f.slice(0, f.lastIndexOf("/") + 1);
        const root = new URL(".", location.href).href;
        document.getElementById("file").textContent = f;
        document.getElementById("raw").href = f;
        fetch(f)
          .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
          .then((html) => {
            // Same asset rewrites the plugin applies (assets_to_plugin_urls):
            // bundled Img/, Css/, Js/ placeholders -> repo asset paths.
            let out = html
              .split('="Img/').join('="assets/img/')
              .split('="Css/tailwind.css').join('="assets/css/tailwind.css')
              .split('="Js/site.js').join('="assets/js/site.js');
            out = out.replace(/<head(\s[^>]*)?>/i, (m) => m + '<base href="' + root + '">');
            // Internal href="<slug>.html" links stay inside the previewer.
            out = out.replace(/href="([\w-]+)\.html"/g, (m, slug) =>
              'href="preview.html?f=' + encodeURIComponent(dir + slug + ".html") + (embed ? "&embed=1" : "") + '"');
            document.getElementById("frame").srcdoc = out;
          })
          .catch((e) => err("Could not load " + f + " — " + e.message));
      }
    </script>
  </body>
</html>
