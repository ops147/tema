<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Template preview</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-brand: #5b67b5;
        --color-navy: #191d33;
        --color-cream: #f7f8fd;
        --font-sans: "Work Sans", ui-sans-serif, system-ui, sans-serif;
      }
      html, body { height: 100%; }
      body { @apply bg-white font-sans flex flex-col; }
    </style>
  </head>
  <body>
    <div id="bar" class="flex items-center gap-4 border-b border-slate-100 bg-white px-4 py-2 text-xs text-slate-600">
      <a href="index.html" class="font-semibold text-brand no-underline hover:text-navy">&larr; demos</a>
      <span id="file" class="min-w-0 flex-1 truncate font-mono text-[11px] text-slate-400"></span>
      <a id="raw" href="#" target="_blank" rel="noopener" class="font-semibold text-brand no-underline hover:text-navy">open raw &nearr;</a>
    </div>
    <div id="err" class="hidden p-8 text-sm text-red-500"></div>
    <iframe id="frame" title="Template preview" class="w-full flex-1 border-0 bg-white"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const embed = params.get("embed") === "1";
      if (embed) document.getElementById("bar").style.display = "none";
      const f = params.get("f") || "";
      const err = (msg) => { const e = document.getElementById("err"); e.classList.remove("hidden"); e.textContent = msg; };

      if (!/^templates\/[\w.\/-]+\.html$/.test(f) || f.includes("..")) {
        err("Missing or invalid ?f= parameter (expected templates/<demo>/<page>.html).");
      } else {
        const dir = f.slice(0, f.lastIndexOf("/") + 1); // e.g. "templates/gymnista/"
        const root = new URL(".", location.href).href;
        document.getElementById("file").textContent = f;
        document.getElementById("raw").href = f;
        const suffix = embed ? "&embed=1" : "";

        // The manifest maps link slugs -> real files. Templates use two link
        // styles: filename ("services.html") and slug ("gymnista-faq.html");
        // the plugin resolves both through the manifest — mirror that here.
        Promise.all([
          fetch(f).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }),
          fetch("templates/manifest.json").then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
        ])
          .then(([html, manifest]) => {
            const tpl = manifest.templates || {};
            const slugFile = {}, files = new Set();
            for (const [slug, t] of Object.entries(tpl)) {
              slugFile[slug] = "templates/" + t.file;
              files.add("templates/" + t.file);
            }
            const resolve = (slug) => {
              const sameDir = dir + slug + ".html";
              return files.has(sameDir) ? sameDir : (slugFile[slug] || sameDir);
            };

            let out = html
              .split('="Img/').join('="assets/img/')
              .split('="Css/tailwind.css').join('="assets/css/tailwind.css')
              .split('="Js/site.js').join('="assets/js/site.js');
            out = out.replace(/<head(\s[^>]*)?>/i, (m) => m + '<base href="' + root + '">');
            out = out.replace(/href="([\w-]+)\.html"/g, (m, slug) =>
              'href="preview.html?f=' + encodeURIComponent(resolve(slug)) + suffix + '"');
            document.getElementById("frame").srcdoc = out;
          })
          .catch((e) => err("Could not load " + f + " — " + e.message));
      }
    </script>
  </body>
</html>
