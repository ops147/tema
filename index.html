<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-navy: #000f44;
        --color-ink: #555555;
        --color-line: #dedede;
        --color-blue: #1d70db;
        --color-blue-d: #155cb8;
        --color-soft: #f5f7fb;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      body { @apply bg-white text-ink font-sans antialiased; }
      code { @apply font-mono; }
      .btn-primary { @apply inline-flex items-center gap-2 bg-blue hover:bg-blue-d text-white text-sm font-semibold rounded-lg px-6 py-3 transition no-underline shadow-sm; }
      .btn-ghost { @apply inline-flex items-center gap-2 border border-line hover:border-navy text-navy text-sm font-semibold rounded-lg px-6 py-3 transition no-underline; }
      .marquee { animation: marquee 45s linear infinite; }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    </style>
  </head>
  <body>

    <!-- ============ header (rendered from site.json) ============ -->
    <header id="site-header" class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-line"></header>

    <!-- ============ hero ============ -->
    <section class="bg-soft border-b border-line">
      <div class="max-w-6xl mx-auto px-6 pt-20 pb-14 text-center">
        <span id="hero-badge" class="inline-block text-[11px] font-bold uppercase tracking-widest text-blue bg-blue/10 rounded-full px-3.5 py-1.5 mb-5"></span>
        <h1 id="hero-title" class="text-4xl sm:text-5xl lg:text-[3.4rem] font-extrabold text-navy tracking-tight leading-[1.08]"></h1>
        <p id="hero-lead" class="mt-5 text-base sm:text-lg text-ink/90 max-w-2xl mx-auto"></p>
        <div id="hero-ctas" class="mt-8 flex flex-wrap justify-center gap-3"></div>
      </div>

      <!-- marquee of demo names -->
      <div class="border-t border-line bg-white overflow-hidden py-4">
        <div id="marquee" class="marquee flex whitespace-nowrap gap-10 w-max text-sm font-semibold text-ink/60"></div>
      </div>
    </section>

    <!-- ============ intro strip ============ -->
    <section class="max-w-4xl mx-auto px-6 py-14 text-center">
      <p id="intro" class="text-base sm:text-lg text-ink/90 leading-relaxed"></p>
    </section>

    <!-- ============ featured templates ============ -->
    <section id="demos" class="max-w-6xl mx-auto px-6 pb-8 scroll-mt-20">
      <h2 id="demos-title" class="text-3xl sm:text-4xl font-extrabold text-navy tracking-tight text-center"></h2>
      <p id="demos-lead" class="mt-4 text-ink/90 max-w-2xl mx-auto text-center"></p>

      <div id="grid" class="mt-10 grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <div class="mt-10 text-center">
        <a id="demos-more" href="browse.html" class="btn-ghost"></a>
      </div>
    </section>

    <!-- ============ key features ============ -->
    <section class="bg-soft border-y border-line mt-16">
      <div class="max-w-6xl mx-auto px-6 py-16">
        <h2 id="feat-title" class="text-3xl font-extrabold text-navy tracking-tight text-center"></h2>
        <p id="feat-lead" class="mt-3 text-ink/90 text-center max-w-xl mx-auto"></p>
        <div class="mt-10 grid sm:grid-cols-2 lg:grid-cols-4 gap-5" id="features"></div>
      </div>
    </section>

    <!-- ============ setup ============ -->
    <section id="setup" class="max-w-6xl mx-auto px-6 py-16 scroll-mt-20">
      <h2 id="setup-title" class="text-3xl font-extrabold text-navy tracking-tight text-center"></h2>
      <p id="setup-lead" class="mt-3 text-ink/90 text-center max-w-xl mx-auto"></p>
      <div id="setup-urls" class="mt-8 max-w-3xl mx-auto bg-white border border-line rounded-2xl p-6 shadow-sm"></div>
      <ol class="mt-8 max-w-3xl mx-auto grid sm:grid-cols-3 gap-5 text-sm" id="steps"></ol>
    </section>

    <!-- ============ cta ============ -->
    <section class="bg-navy">
      <div class="max-w-6xl mx-auto px-6 py-14 text-center">
        <h2 id="cta-title" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight"></h2>
        <p id="cta-text" class="mt-3 text-white/70 max-w-xl mx-auto"></p>
        <a id="cta-btn" href="#setup" class="btn-primary mt-7 !bg-white !text-navy hover:!bg-soft"></a>
      </div>
    </section>

    <!-- ============ footer (rendered from site.json) ============ -->
    <footer id="site-footer" class="border-t border-line px-6 py-6 text-center text-xs text-ink/70"></footer>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>
